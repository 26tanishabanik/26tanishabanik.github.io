<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3471a'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Georgia,serif' font-size='19' fill='%23fff'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="https://github.com/26tanishabanik">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="top">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>{{ site.author.name }}, {{ 'now' | date: '%Y' }}</span>
      <a href="{{ '/' | relative_url }}">All writing</a>
    </div>
  </footer>
  <script src="{{ '/assets/js/post.js' | relative_url }}" defer></script>
</body>
</html>
